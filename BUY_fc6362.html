<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUY</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;900&family=Playfair+Display:ital,wght@1,600&family=Space+Mono&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--b:#000;--w:#fff;--g:#8a8a8a}
html,body{background:var(--b);color:var(--w);font:16px/1.5 Manrope,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--g);padding:.7rem 0;outline:0;margin-bottom:1rem}
input:focus,textarea:focus{border-color:var(--w)}
button{cursor:pointer;background:var(--w);color:var(--b);border:1px solid var(--w);padding:.7rem 1.4rem;font-weight:600}
button.o{background:none;color:var(--w)}
button:focus-visible,input:focus-visible{outline:2px solid var(--w);outline-offset:3px}
.logo{font:900 clamp(4rem,22vw,9rem)/.9 Unbounded;letter-spacing:-.06em}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;padding-top:calc(1rem + env(safe-area-inset-top,0px));border-bottom:1px solid #333}
header .logo{font-size:2rem}
#auth{min-height:100vh;padding:2rem 1.4rem;max-width:440px;margin:auto;display:flex;flex-direction:column;justify-content:center}
.tabs{display:flex;gap:1.4rem;margin:2rem 0 1.2rem}
.tabs b{cursor:pointer;color:var(--g);font-weight:600}.tabs b.on{color:var(--w);border-bottom:2px solid var(--w)}
.err{color:var(--w);background:#222;padding:.6rem .8rem;margin-bottom:1rem;display:none}
#drawer{position:fixed;inset:0 0 0 auto;width:min(80vw,320px);background:var(--w);color:var(--b);transform:translateX(100%);transition:transform .25s;z-index:9;padding:5rem 1.6rem;display:flex;flex-direction:column;gap:1.2rem}
#drawer.on{transform:none}
#drawer a{font:900 1.8rem Unbounded;cursor:pointer;letter-spacing:-.04em}
main{max-width:720px;margin:auto;padding:1.4rem}
h1{font:900 2rem Unbounded;letter-spacing:-.05em;margin-bottom:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:#333;border:1px solid #333}
.it{background:var(--b);padding:1rem}
.it img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1);margin-bottom:.8rem;background:#222}
.it h3{font:600 1rem Manrope}.price{font:900 1.4rem Unbounded;margin:.4rem 0 .8rem}
.row{border-bottom:1px solid #333;padding:1rem 0}.row small{color:var(--g)}
.chat{height:55vh;overflow:auto;border:1px solid #333;padding:1rem;margin-bottom:1rem}
.msg{margin-bottom:.8rem}.msg b{font-family:'Space Mono'}
.pc{border:1px solid var(--w);overflow:hidden;padding-bottom:1.4rem;text-align:center;background:var(--b)}
.pc.inv{background:var(--w);color:var(--b)}
.ban{height:130px;background-color:#000;border-bottom:1px solid var(--w)}
.av{width:96px;height:96px;border-radius:50%;margin:-48px auto .8rem;background:var(--w);color:var(--b);border:3px solid var(--b);display:grid;place-items:center;font:900 2.4rem Unbounded;overflow:hidden}
.pc.inv .av{background:var(--b);color:var(--w);border-color:var(--w)}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.pc h2{font-size:1.6rem}.pc small{opacity:.6}.pc p{padding:.6rem 1.4rem 0}
.opts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.opts button{padding:.4rem .8rem}.opts button.sel{background:var(--w);color:var(--b)}.opts button:not(.sel){background:none;color:var(--w)}
#toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--w);color:var(--b);padding:.7rem 1.2rem;transition:transform .25s;z-index:20}
#toast.on{transform:translate(-50%,0)}
select{width:100%;background:#000;color:#fff;border:1px solid var(--g);padding:.7rem;margin-bottom:1rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="root"></div><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updatePassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,query,orderBy,limit,onSnapshot,serverTimestamp,writeBatch,where,increment,arrayUnion,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ВСТАВЬТЕ СЮДА свой firebaseConfig из консоли Firebase
const firebaseConfig={apiKey:"AIzaSyDNrEBduA-hOzneNRV73FmZ768bDq4MZo8",authDomain:"tradebase-6108b.firebaseapp.com",projectId:"tradebase-6108b",storageBucket:"tradebase-6108b.firebasestorage.app",messagingSenderId:"1074175487416",appId:"1:1074175487416:web:f3f5c646b1e14179fe334d"};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),root=$("#root");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=t=>{const e=$("#toast");e.textContent=t;e.className="on";setTimeout(()=>e.className="",2600)};
const FONTS=["Unbounded","'Playfair Display',serif","'Space Mono',monospace"];
const BAN=["repeating-linear-gradient(45deg,#fff 0 2px,#000 2px 14px)","radial-gradient(#fff 1.5px,transparent 1.5px) 0 0/14px 14px","linear-gradient(90deg,#fff 0 1px,transparent 1px) 0 0/18px 100%","repeating-radial-gradient(circle at 20% 50%,#fff 0 2px,#000 2px 12px)","conic-gradient(#fff,#000,#fff)","#fff"];
let me=null,prof=null,isAdmin=false,isOwner=false,view="shop",offs=[],busy=false;
const off=()=>{offs.forEach(f=>f());offs=[]};
const em=n=>n+"@buy.app.local";

/* ---------- AUTH ---------- */
function authScreen(mode="in"){
 off();root.innerHTML=`<div id="auth"><div class="logo">BUY</div>
 <div class="tabs"><b id="t1" class="${mode=="in"?"on":""}">Вход</b><b id="t2" class="${mode=="up"?"on":""}">Регистрация</b></div>
 <div class="err" id="err"></div>
 <input id="u" placeholder="Имя пользователя" autocomplete="username" autocapitalize="none">
 <input id="p" type="password" placeholder="Пароль" autocomplete="${mode=="in"?"current-password":"new-password"}">
 <button id="go">${mode=="in"?"Войти":"Создать аккаунт"}</button></div>`;
 $("#t1").onclick=()=>authScreen("in");$("#t2").onclick=()=>authScreen("up");
 const err=t=>{const e=$("#err");e.textContent=t;e.style.display="block"};
 $("#go").onclick=async()=>{
  const n=$("#u").value.trim().replace(/^@/,"").toLowerCase(),p=$("#p").value;
  try{
   if(mode=="in"){
    try{await signInWithEmailAndPassword(auth,em(n),p)}catch{throw"Неверное имя или пароль"}
   }else{
    if(!/^[a-z0-9_]{3,20}$/.test(n))throw"Имя: 3–20 символов, латиница, цифры и _";
    if(p.length<6)throw"Пароль: минимум 6 символов";
    if((await getDoc(doc(db,"usernames",n))).exists())throw"Это имя занято. Придумайте другое";
    busy=true;let c;
    try{c=await createUserWithEmailAndPassword(auth,em(n),p)}catch(e){busy=false;throw e.code=="auth/email-already-in-use"?"Это имя занято. Придумайте другое":"Не удалось зарегистрироваться"}
    const b=writeBatch(db);
    b.set(doc(db,"usernames",n),{uid:c.user.uid});
    b.set(doc(db,"users",c.user.uid),{username:n,name:n,bio:"",avatar:"",banner:0,font:0,inv:false,balance:0,created:serverTimestamp()});
    await b.commit();
    if(n=="owner")try{await setDoc(doc(db,"admins",c.user.uid),{owner:true})}catch{}
    busy=false;await boot(c.user);
   }
  }catch(e){err(typeof e=="string"?e:"Ошибка. Попробуйте ещё раз")}
 }
}
async function boot(u){
 me=u;prof=(await getDoc(doc(db,"users",u.uid))).data();
 const ad=await getDoc(doc(db,"admins",u.uid));isAdmin=ad.exists();isOwner=!!ad.data()?.owner;shell();
}
onAuthStateChanged(auth,u=>{if(busy)return;u?boot(u):(me=null,authScreen())});

/* ---------- SHELL ---------- */
function shell(){
 const L=[["shop","Shop"],["shops","Магазины"],["myshop","Мой магазин"],["profile","Профиль"],["chat","Чат"],["posts","Блог"],["market","NFT"],["support","Поддержка"],["settings","Настройки"]];if(isAdmin)L.push(["admin","Админ"]);
 root.innerHTML=`<header><div class="logo">BUY</div><button class="o" id="mb" aria-label="Меню">☰</button></header>
 <nav id="drawer">${L.map(([k,t])=>`<a data-v="${k}">${t}</a>`).join("")}<a id="out" style="font-size:1rem;margin-top:auto">Выйти</a></nav><main id="m"></main>`;
 $("#mb").onclick=()=>$("#drawer").classList.toggle("on");
 document.querySelectorAll("#drawer a[data-v]").forEach(a=>a.onclick=()=>go(a.dataset.v));
 $("#out").onclick=()=>signOut(auth);watch();go(view);
}
function go(v){view=v;off();$("#drawer").classList.remove("on");({shop,shops,myshop,posts,chat,profile,support,settings,admin,market})[v]()}
const M=h=>$("#m").innerHTML=h;
const when=t=>t?.toDate?t.toDate().toLocaleString("ru"):"";

/* ---------- SHOP ---------- */
function shop(){
 M(`<h1>Shop</h1><div class="grid" id="g"></div>`);
 offs.push(onSnapshot(query(collection(db,"products"),orderBy("created","desc")),s=>{
  $("#g").innerHTML=s.empty?`<div class="it">Товаров пока нет.</div>`:s.docs.map(d=>{const p=d.data();
   return`<div class="it">${p.img?`<img src="${esc(p.img)}" alt="">`:""}<h3>${esc(p.title)}</h3><p style="color:var(--g)">${esc(p.desc)}</p><div class="price">${esc(p.price)}</div><button class="buy">Купить</button></div>`}).join("");
  document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>toast("Оплата скоро будет подключена"));
 }));
}

/* ---------- POSTS ---------- */
function posts(){
 M(`<h1>Блог</h1><div id="l"></div>`);
 offs.push(onSnapshot(query(collection(db,"posts"),orderBy("created","desc")),s=>{
  $("#l").innerHTML=s.empty?"<p>Постов пока нет.</p>":s.docs.map(d=>{const p=d.data();
   return`<div class="row"><h3 style="font:900 1.3rem Unbounded">${esc(p.title)}</h3><small>${when(p.created)}</small><p style="margin:.6rem 0;white-space:pre-wrap">${esc(p.text)}</p>
   <button class="o" data-c="${d.id}">Комментарии</button>${isAdmin?` <button class="o" data-x="${d.id}">Удалить</button>`:""}<div id="c${d.id}"></div></div>`}).join("");
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>deleteDoc(doc(db,"posts",b.dataset.x)));
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>comments(b.dataset.c));
 }));
}
let coff=null;
function comments(id){
 coff&&coff();const box=$("#c"+id);
 box.innerHTML=`<div id="cl${id}" style="margin:.8rem 0"></div><input id="ci${id}" placeholder="Ваш комментарий"><button id="cs${id}">Отправить</button>`;
 coff=onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("created")),s=>{
  $("#cl"+id).innerHTML=s.docs.map(d=>`<p><b>@${esc(d.data().name)}</b> ${esc(d.data().text)}</p>`).join("")||"<small>Пока пусто</small>"});
 offs.push(()=>coff&&coff());
 $("#cs"+id).onclick=async()=>{const t=$("#ci"+id).value.trim();if(!t)return;
  await addDoc(collection(db,"posts",id,"comments"),{uid:me.uid,name:prof.username,text:t.slice(0,400),created:serverTimestamp()});$("#ci"+id).value=""};
}

/* ---------- CHAT ---------- */
function chatOld(){
 M(`<h1>Чат</h1><div class="chat" id="cb"></div><input id="mi" placeholder="Сообщение"><button id="ms">Отправить</button>`);
 offs.push(onSnapshot(query(collection(db,"messages"),orderBy("created","desc"),limit(100)),s=>{
  const cb=$("#cb");cb.innerHTML=s.docs.reverse().map(d=>{const m=d.data();
   return`<div class="msg"><b>@${esc(m.name)}</b> ${esc(m.text)}${isAdmin?` <a data-x="${d.id}" style="cursor:pointer;color:var(--g)">✕</a>`:""}</div>`}).join("");
  cb.scrollTop=cb.scrollHeight;
  cb.querySelectorAll("[data-x]").forEach(a=>a.onclick=()=>deleteDoc(doc(db,"messages",a.dataset.x)));
 }));
 const send=async()=>{const t=$("#mi").value.trim();if(!t)return;
  await addDoc(collection(db,"messages"),{uid:me.uid,name:prof.username,text:t.slice(0,500),created:serverTimestamp()});$("#mi").value=""};
 $("#ms").onclick=send;$("#mi").onkeydown=e=>e.key=="Enter"&&send();
}

/* ---------- PROFILE ---------- */
const card=p=>`<div class="pc ${p.inv?"inv":""}"><div class="ban" style="background:${BAN[p.banner||0]}"></div>
 <div class="av">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc((p.name||"?")[0].toUpperCase())}</div>
 <h2 style="font-family:${FONTS[p.font||0]}">${esc(p.name)}</h2><small>@${esc(p.username)}</small><p>${esc(p.bio)}</p></div>`;
function profile(){
 const d={...prof};
 const draw=()=>$("#prev").innerHTML=card(d);
 M(`<h1>Профиль</h1><div id="prev"></div><div style="margin-top:1.4rem">
 <input id="pn" placeholder="Отображаемое имя" maxlength="30" value="${esc(d.name)}">
 <textarea id="pb" placeholder="О себе" maxlength="200" rows="2">${esc(d.bio)}</textarea>
 <input id="pa" placeholder="Ссылка на аватар (https://…)" value="${esc(d.avatar)}">
 <p><small>Обложка</small></p><div class="opts" id="o1">${BAN.map((_,i)=>`<button data-i="${i}">${i+1}</button>`).join("")}</div>
 <p><small>Шрифт имени</small></p><div class="opts" id="o2"><button data-i="0">Unbounded</button><button data-i="1">Playfair</button><button data-i="2">Mono</button></div>
 <p><small>Цвет карточки</small></p><div class="opts" id="o3"><button data-i="0">Чёрная</button><button data-i="1">Белая</button></div>
 <button id="sv">Сохранить</button></div>`);
 const mark=()=>{[["o1","banner"],["o2","font"]].forEach(([id,k])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle("sel",+b.dataset.i==(d[k]||0))));
  document.querySelectorAll("#o3 button").forEach(b=>b.classList.toggle("sel",!!+b.dataset.i==!!d.inv))};
 [["o1","banner"],["o2","font"]].forEach(([id,k])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{d[k]=+b.dataset.i;mark();draw()}));
 document.querySelectorAll("#o3 button").forEach(b=>b.onclick=()=>{d.inv=!!+b.dataset.i;mark();draw()});
 [["pn","name"],["pb","bio"],["pa","avatar"]].forEach(([id,k])=>$("#"+id).oninput=e=>{d[k]=e.target.value;draw()});
 $("#sv").onclick=async()=>{const u={name:d.name.trim()||d.username,bio:d.bio,avatar:d.avatar.trim(),banner:d.banner||0,font:d.font||0,inv:!!d.inv};
  await updateDoc(doc(db,"users",me.uid),u);Object.assign(prof,u);toast("Профиль сохранён")};
 mark();draw();wallet().then(mine);
}

/* ---------- ADMIN ---------- */
function admin(){
 if(!isAdmin)return;setTimeout(()=>{adminExtra();isOwner&&adminV3()},0);
 M(`<h1>Админ-панель</h1>
 <h3>Новый товар</h3><input id="ap" placeholder="Название"><input id="ac" placeholder="Цена, например 990 ₽"><input id="ai" placeholder="Ссылка на фото"><input id="ad" placeholder="Описание">
 <button id="a1">Добавить товар</button>
 <h3 style="margin-top:2rem">Новый пост</h3><input id="bt" placeholder="Заголовок"><textarea id="bx" rows="4" placeholder="Текст"></textarea><button id="a2">Опубликовать</button>
 <h3 style="margin-top:2rem">Товары</h3><div id="pl"></div>
 <h3 style="margin-top:2rem">Пользователи</h3><div id="ul"></div>`);
 $("#a1").onclick=async()=>{if(!$("#ap").value.trim())return;
  await addDoc(collection(db,"products"),{title:$("#ap").value.trim(),price:$("#ac").value.trim(),img:$("#ai").value.trim(),desc:$("#ad").value.trim(),created:serverTimestamp()});
  ["ap","ac","ai","ad"].forEach(i=>$("#"+i).value="");toast("Товар добавлен")};
 $("#a2").onclick=async()=>{if(!$("#bt").value.trim())return;
  await addDoc(collection(db,"posts"),{title:$("#bt").value.trim(),text:$("#bx").value,created:serverTimestamp()});
  $("#bt").value=$("#bx").value="";toast("Пост опубликован")};
 offs.push(onSnapshot(collection(db,"products"),s=>{$("#pl").innerHTML=s.docs.map(d=>`<div class="row">${esc(d.data().title)} <button class="o" data-x="${d.id}">Удалить</button></div>`).join("")||"<small>Нет товаров</small>";
  document.querySelectorAll("#pl [data-x]").forEach(b=>b.onclick=()=>deleteDoc(doc(db,"products",b.dataset.x)))}));
 offs.push(onSnapshot(collection(db,"users"),s=>{$("#ul").innerHTML=`<small>Всего: ${s.size}</small>`+s.docs.map(d=>`<div class="row">@${esc(d.data().username)} <small>${when(d.data().created)}</small></div>`).join("")}));
}

/* ---------- v2: магазины, поддержка, кошелёк, настройки ---------- */
const stars=n=>"★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));
const uidOf=async n=>(await getDoc(doc(db,"usernames",n.trim().replace(/^@/,"").toLowerCase()))).data()?.uid;
const buyBtn=()=>document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>toast("Покупка за баланс появится на следующем шаге"));
const rate=(id,el)=>offs.push(onSnapshot(collection(db,"shops",id,"reviews"),s=>{const n=s.size,a=n?s.docs.reduce((x,d)=>x+d.data().stars,0)/n:0;el.textContent=n?`${stars(a)} ${a.toFixed(1)} · отзывов: ${n}`:"Пока нет отзывов"}));
const prod=p=>`<div class="it">${p.img?`<img src="${esc(p.img)}" alt="">`:""}<h3>${esc(p.title)}</h3><p style="color:var(--g)">${esc(p.desc)}</p><div class="price">${esc(p.price)} монет</div><button class="buy">Купить</button></div>`;

function shops(){
 M(`<h1>Магазины</h1><div class="grid" id="g"></div>`);
 offs.push(onSnapshot(collection(db,"shops"),s=>{
  $("#g").innerHTML=s.empty?`<div class="it">Магазинов пока нет. Создайте свой в разделе «Мой магазин».</div>`:s.docs.map(d=>{const p=d.data();
   return`<div class="it" data-s="${d.id}" style="cursor:pointer">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:""}<h3>${esc(p.name)}</h3><small data-r="${d.id}"></small></div>`}).join("");
  document.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>openShop(e.dataset.s));
  document.querySelectorAll("[data-r]").forEach(e=>rate(e.dataset.r,e));
 }));
}
async function openShop(id){
 off();curShop=id;const sh=(await getDoc(doc(db,"shops",id))).data();if(!sh)return;
 M(`<h1>${esc(sh.name)}${vf(id)}</h1><p><small id="rt"></small></p><p>${esc(sh.desc)}</p><div id="cat"></div><h3 style="margin-top:2rem">Отзывы</h3>
 ${id!=me.uid?`<select id="st">${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select><textarea id="rx" rows="2" maxlength="300" placeholder="Ваш отзыв"></textarea><button id="rs">Оставить отзыв</button>`:""}<div id="rv"></div>`);
 rate(id,$("#rt"));let C=[],P=[];
 const draw=()=>{$("#cat").innerHTML=C.map(c=>`<h3 style="margin:1.4rem 0 .6rem">${esc(c.name)}</h3><div class="grid">${P.filter(p=>p.cat==c.id).map(p=>prod(p).replace('class="buy"','class="buy" data-p="'+p.id+'"')).join("")||'<div class="it">Пусто</div>'}</div>`).join("")||"<p>Товаров пока нет.</p>";buyBtn()};
 offs.push(onSnapshot(collection(db,"shops",id,"cats"),s=>{C=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 offs.push(onSnapshot(collection(db,"shops",id,"products"),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 offs.push(onSnapshot(collection(db,"shops",id,"reviews"),s=>{$("#rv").innerHTML=s.docs.map(d=>`<div class="row"><b>@${esc(d.data().name)}</b> ${stars(d.data().stars)}<br>${esc(d.data().text)}</div>`).join("")||"<small>Отзывов пока нет</small>"}));
 if(id!=me.uid)$("#rs").onclick=async()=>{await setDoc(doc(db,"shops",id,"reviews",me.uid),{uid:me.uid,name:prof.username,stars:+$("#st").value,text:$("#rx").value.slice(0,300),created:serverTimestamp()});toast("Отзыв сохранён")};
}
async function myshop(){
 const r=doc(db,"shops",me.uid),sh=(await getDoc(r)).data();
 if(!sh){M(`<h1>Мой магазин</h1><input id="sn" placeholder="Название" maxlength="40"><textarea id="sd" rows="3" maxlength="300" placeholder="Описание"></textarea><input id="sa" placeholder="Ссылка на аватарку"><button id="sc">Создать магазин</button>`);

 M(`<button class="o" id="bk">← Назад</button><h1 style="margin-top:1rem">Аналитика</h1><div class="grid">${k("Заказов",O.length)}${k("На сумму",sum)}${k("Покупателей",new Set(O.map(o=>o.buyer)).size)}${k("Средний чек",O.length?Math.round(sum/O.length):0)}</div>
 <h3 style="margin:1.4rem 0 .6rem">Топ товаров</h3>${T.map(([t,n])=>bar(t,n,T[0][1])).join("")||"<small>Данных пока нет</small>"}<h3 style="margin:1.4rem 0 .6rem">Заказы по дням</h3>${D.map(([t,n])=>bar(t,n,Math.max(...D.map(x=>x[1])))).join("")||"<small>Данных пока нет</small>"}`);
 $("#bk").onclick=()=>go("myshop")}
function adminV3(){
 $("#m").insertAdjacentHTML("beforeend",`<h3 style="margin-top:2rem">Новый подарок (NFT)</h3><input id="gn" placeholder="Название"><input id="gd" placeholder="Описание"><input id="gi" placeholder="Ссылка на фото"><input id="gp" type="number" min="0" placeholder="Цена в монетах"><button id="g2">Создать подарок</button>
 <h3 style="margin-top:2rem">Юзернейм на продажу</h3><input id="un" placeholder="юзернейм"><input id="up" type="number" min="0" placeholder="Цена в монетах"><button id="u2">Выставить</button>
 <h3 style="margin-top:2rem">Верификация ✓</h3><input id="vu" placeholder="Имя пользователя"><button id="v1">Выдать</button> <button class="o" id="v2">Снять</button>`);
 $("#g2").onclick=async()=>{if(!$("#gn").value.trim())return;await addDoc(collection(db,"gifts"),{name:$("#gn").value.trim(),desc:$("#gd").value,img:$("#gi").value.trim(),price:+$("#gp").value||0});toast("Подарок создан")};
 $("#u2").onclick=async()=>{const n=$("#un").value.trim().replace(/^@/,"").toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(n))return toast("3–20 символов");
  if(await uidOf(n))return toast("Имя занято");const b=writeBatch(db);b.set(doc(db,"usernames",n),{uid:me.uid});b.set(doc(db,"unames",n),{price:+$("#up").value||0});await b.commit();toast("Выставлено")};
 const ver=f=>async()=>{const u=await uidOf($("#vu").value);if(!u)return toast("Не найден");await f(u);toast("Готово")};
 $("#v1").onclick=ver(u=>setDoc(doc(db,"verified",u),{on:true}));$("#v2").onclick=ver(u=>deleteDoc(doc(db,"verified",u)));
}
</script></body></html>
